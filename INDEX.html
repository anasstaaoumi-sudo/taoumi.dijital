<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منيو رقمي و QR Code للمطاعم والمقاهي</title>
<meta name="description" content="منيو رقمي للمطاعم والمقاهي، صور احترافية، QR Code وموقع للمطعم.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<style>
:root{--ink:#17202a;--acc:#c43d1f;--wa:#0f7d42;--sand:#f7f1e8;--line:#e4dccd;--mut:#5d6670}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Cairo,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.7;font-size:17px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px}
.brand{font-weight:800;font-size:20px;direction:ltr}
.brand span{color:var(--acc)}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;direction:ltr}
.lang button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--ink);padding:2px 11px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:600;padding:11px 24px;border-radius:999px;color:#fff;background:var(--ink);transition:transform .2s,filter .2s}
.btn.acc{background:var(--acc)}.btn.wa{background:var(--wa)}
.btn.line{background:none;color:var(--ink);border:2px solid var(--ink);padding:9px 22px}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
header .btn{padding:6px 16px}

.hero{padding:56px 0 64px;background:var(--sand);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.hero h1{font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1.2;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{margin-top:16px;font-size:19px;color:var(--mut);max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}

.phone{justify-self:center;width:236px;background:#fff;border:8px solid var(--ink);border-radius:36px;padding:22px 16px 18px;box-shadow:0 22px 40px #17202a30;transform:rotate(-3deg)}
.phone h4{font-size:16px;text-align:center;margin-bottom:8px}
.ln{display:flex;align-items:baseline;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.ln i{flex:1;border-bottom:2px dotted #c9bda8;margin:0 6px;transform:translateY(-3px)}
.ln b{color:var(--acc);direction:ltr}
.qr{width:92px;height:92px;margin:14px auto 2px}
.qr svg{width:100%;height:100%;fill:var(--ink)}
.phone small{display:block;text-align:center;font-size:12px;color:var(--mut)}

section{padding:64px 0}
h2{font-weight:800;font-size:clamp(26px,4vw,36px);line-height:1.3}
.lead{color:var(--mut);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.card{border:1px solid var(--line);border-radius:18px;padding:18px 18px 24px;background:#fff;position:relative;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 30px #17202a1a}
.art{height:168px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.a1{background:#fde7df}.a2{background:#e1eee6}.a3{background:#e6ebf8}
.art svg{height:100%;width:auto;max-width:100%}
.card .n{font-weight:800;font-size:38px;line-height:1;color:var(--acc);margin-top:16px}
.card h3{font-size:22px;margin-top:6px}
.card p{margin-top:6px;color:var(--mut);font-size:16px}
.nrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
.nrow .n{margin-top:0}
.tag{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px}

/* illustrations */
.ink{stroke:var(--ink);stroke-width:3;fill:#fff}
.sf{fill:var(--ink)}.sm{fill:#b8b2a6}.sa{fill:var(--acc)}
.scan{position:relative;width:132px;height:132px}
.scan .box{position:absolute;inset:14px;background:#fff;border-radius:10px;padding:8px}
.scan svg.q{width:100%;height:100%;fill:var(--ink)}
.scan svg.br{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round}
.scan .beam{position:absolute;inset-inline:8px;top:14px;height:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}

#contact{background:var(--sand)}
form{max-width:640px;margin:28px auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 26px;text-align:start}
label,legend{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid #cfc6b6;border-radius:12px;background:#fff}
textarea{min-height:90px;resize:vertical}
fieldset{border:0}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:400;margin:0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
form .btn{width:100%;margin-top:22px;font-size:18px;padding:14px}
#msg{margin-top:12px;min-height:26px;font-weight:600;color:var(--acc);text-align:center}
.center{text-align:center}

footer{background:var(--ink);color:#fff;padding:34px 0;text-align:center}
footer a{text-decoration:underline;text-underline-offset:4px}
footer p+p{margin-top:6px}
footer .ph{direction:ltr;display:inline-block}

@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.phone{order:-1;margin-bottom:8px}.cards{grid-template-columns:1fr}section{padding:48px 0}.brand{font-size:17px}.lang button{padding:2px 8px}}
@media(max-width:400px){header .btn{padding:6px 11px;font-size:15px}.tools{gap:6px}}

@media(prefers-reduced-motion:no-preference){
  /* Keep every section visible even if scroll-reveal JavaScript fails. */
  .js .rv{opacity:1;transform:none;transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0s)}
  .js .rv.in{opacity:1;transform:none}
  .hero .wrap>div:first-child>*{animation:up .8s both}
  .hero h1{animation-delay:.05s}.hero p{animation-delay:.2s}.hero .cta{animation-delay:.35s}
  @keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .phone{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-12px)}}
  .row{animation:pop 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*.6s)}
  @keyframes pop{0%,100%{opacity:.4}15%,55%{opacity:1}}
  .scan .beam{animation:beam 2.6s ease-in-out infinite alternate}
  @keyframes beam{from{top:16px}to{top:calc(100% - 20px)}}
  .pin{animation:hop 1.6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
}

/* === Photographic + 3D upgrade === */
.hero{
  position:relative;isolation:isolate;color:#fff;
  background:linear-gradient(105deg,rgba(12,17,22,.90) 0%,rgba(12,17,22,.78) 48%,rgba(12,17,22,.58) 100%),
    url('https://images.unsplash.com/photo-1550966842-28ca7749f5c3?auto=format&fit=crop&w=2200&q=90') center/cover no-repeat;
  perspective:1600px;
}
.hero .wrap{perspective:1600px}
.hero h1{color:#fff;text-shadow:0 8px 25px rgba(0,0,0,.28)}
.hero p{color:#f0ece6;text-shadow:0 3px 16px rgba(0,0,0,.28)}
.hero h1 em{color:#ffd06b}
.hero .btn.acc{background:linear-gradient(135deg,#e65a32,#b92f17);box-shadow:0 12px 25px rgba(196,61,31,.28)}
.hero .btn.line{color:#fff;border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.07);backdrop-filter:blur(8px)}
.hero .btn.line:hover{background:#fff;color:var(--ink)}

.phone{
  position:relative;transform-style:preserve-3d;backface-visibility:hidden;
  border:7px solid #101820;border-radius:34px;
  background:linear-gradient(145deg,#fff 0%,#f8f5ef 100%);
  box-shadow:22px 30px 55px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.9);
  transform:rotateY(-15deg) rotateX(7deg) rotateZ(-3deg);
}
@keyframes float{0%,100%{transform:rotateY(-15deg) rotateX(7deg) rotateZ(-3deg) translateY(0)}50%{transform:rotateY(-15deg) rotateX(7deg) rotateZ(-3deg) translateY(-12px)}}
.phone::before{
  content:"";position:absolute;left:-13px;top:48px;bottom:48px;width:7px;
  border-radius:7px 0 0 7px;background:linear-gradient(90deg,#4a535a,#0d1217);
  transform:translateZ(-5px);box-shadow:-2px 0 5px rgba(0,0,0,.22)
}
.phone::after{
  content:"";position:absolute;right:-10px;top:65px;width:5px;height:42px;
  border-radius:0 5px 5px 0;background:#303a42;transform:translateZ(-4px)
}
.phone-food{height:94px;margin:0 0 12px;border-radius:14px;overflow:hidden;position:relative;transform:translateZ(16px);box-shadow:0 8px 18px rgba(0,0,0,.15)}
.phone-food img{width:100%;height:100%;display:block;object-fit:cover}
.phone h4,.phone .ln,.phone .qr,.phone small{position:relative;transform:translateZ(12px)}
.phone h4{font-size:15px}

.cards{perspective:1400px;gap:24px}
.card{transform-style:preserve-3d;backface-visibility:hidden;box-shadow:0 12px 30px rgba(23,32,42,.06);border-radius:20px}
.card:hover{transform:translateY(-11px) rotateX(3deg) rotateY(-2deg);box-shadow:0 28px 50px rgba(23,32,42,.17);border-color:var(--acc)}
.art.photo-art{height:215px;background:#e8e2d7;overflow:hidden;isolation:isolate;transform-style:preserve-3d;box-shadow:inset 0 -25px 40px rgba(0,0,0,.18)}
.art.photo-art img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .65s cubic-bezier(.2,.7,.2,1),filter .5s;filter:saturate(1.08) contrast(1.03)}
.card:hover .art.photo-art img{transform:scale(1.1) translateZ(12px);filter:saturate(1.18) contrast(1.06)}
.art.photo-art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.02) 25%,rgba(0,0,0,.58) 100%)}
.photo-chip{position:absolute;z-index:1;left:12px;right:12px;bottom:12px;color:#fff;font:700 10px/1.4 system-ui,sans-serif;letter-spacing:1.4px;text-align:left;text-shadow:0 2px 10px rgba(0,0,0,.5);direction:ltr}
.scan-badge{position:absolute;z-index:2;inset:50% auto auto 50%;transform:translate(-50%,-50%) rotate(-5deg);width:82px;height:92px;border:1px solid rgba(255,255,255,.9);border-radius:14px;background:rgba(255,255,255,.90);box-shadow:0 12px 35px rgba(0,0,0,.23);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);backdrop-filter:blur(10px)}
.scan-badge i{width:34px;height:34px;border:5px solid var(--ink);outline:3px solid var(--acc);outline-offset:-10px;display:block;margin-bottom:3px;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0/9px 9px}
.scan-badge b{font-size:16px;line-height:1.1}.scan-badge small{font-size:8px;letter-spacing:1.7px}
.card .n,.card h3,.card p,.card .nrow{transform:translateZ(12px)}
.card .n{color:var(--acc)}
.card h3{font-size:23px}

/* Gentle 3D polish on controls and form */
.btn{box-shadow:0 5px 0 rgba(23,32,42,.12);transition:transform .25s,filter .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 18px rgba(23,32,42,.17)}
form{box-shadow:0 24px 60px rgba(23,32,42,.09);transition:transform .35s,box-shadow .35s}
form:focus-within{box-shadow:0 28px 70px rgba(23,32,42,.14);transform:translateY(-3px)}

@media(max-width:820px){
  .hero{background-position:58% center;padding-top:42px}
  .hero .wrap{gap:26px}
  .phone{transform:rotateY(-8deg) rotateX(4deg) rotateZ(-2deg);width:226px}
  .art.photo-art{height:230px}
}
@media(max-width:420px){
  .hero h1{font-size:32px}
  .hero p{font-size:17px}
  .cta .btn{padding:10px 15px;font-size:14px}
  form{padding:22px 17px}
}
@media(prefers-reduced-motion:reduce){
  .phone,.phone-food,.card,.art.photo-art img,.btn,form{animation:none!important;transition:none!important}
}

</style>
</head>
<body>

<header>

    <a class="brand" href="#">Menu <span>Digital</span></a>

        <button data-l="ar" aria-pressed="true">AR</button>

        <button data-l="en" aria-pressed="false">EN</button>

    </div>
  </div>
</header>

<div class="hero">
  <div class="wrap">

      <div class="qr" id="qr"></div>
      <small data-t="ps"></small>
    </div>
  </div>
</div>

<section id="services">
  <div class="wrap">
    <h2 class="rv" data-t="sh"></h2>
    <p class="lead rv" data-t="sl" style="--d:.1s"></p>
    <div class="cards">
      <div class="card rv" style="--d:.1s">
        <div class="art a1 photo-art" aria-hidden="true">
          <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=1000&q=85" alt="" loading="lazy" decoding="async">
          <span class="photo-chip">MENU DIGITAL</span>
        </div>

      </div>
      <div class="card rv" style="--d:.25s">
        <div class="art a2" aria-hidden="true">
          <div class="scan">
            <div class="box" id="qr2"></div>
            <svg class="br" viewBox="0 0 132 132"><path d="M6 30V12a6 6 0 0 1 6-6h18M102 6h18a6 6 0 0 1 6 6v18M126 102v18a6 6 0 0 1-6 6h-18M30 126H12a6 6 0 0 1-6-6v-18"/></svg>

        <h3>QR Code</h3>

          <span class="photo-chip">YOUR RESTAURANT ONLINE</span>
        </div>
        <div class="n">03</div>
        <h3 data-t="s3h"></h3>
        <p data-t="s3p"></p>
      </div>
    </div>
  </div>
</section>

<section id="contact">
  <div class="wrap center">
    <h2 class="rv" data-t="ch"></h2>
    <p class="lead rv" data-t="cl" style="--d:.1s"></p>
    <form id="f" novalidate class="rv" style="--d:.2s">
      <label for="name" data-t="ln"></label>
      <input type="text" id="name" autocomplete="name" required>
      <label for="biz" data-t="lb"></label>
      <input type="text" id="biz" required>
      <label for="city" data-t="lc"></label>

      <fieldset>
        <legend data-t="ls"></legend>

        <label class="chk"><input type="checkbox" name="s" value="1"> <span data-t="o1"></span></label>
        <label class="chk"><input type="checkbox" name="s" value="2"> <span data-t="o2"></span></label>
      </fieldset>
      <label for="note" data-t="lt"></label>
      <textarea id="note"></textarea>
      <button class="btn wa" type="submit" data-t="sd"></button>
      <div id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<footer>
  <div class="wrap">
    <p data-t="ft"></p>
    <p><a class="ph" id="waFoot" target="_blank" rel="noopener" href="#">07 52 24 00 47</a> · <a href="mailto:anasstaaoumi@gmail.com">anasstaaoumi@gmail.com</a></p>
  </div>
</footer>

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let lang="ar";
function setLang(l){
  lang=l;const t=T[l];
  try{localStorage.setItem("lang",l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  $$("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.title=t.title;$("meta[name=description]").content=t.meta;
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  const u="https://wa.me/"+WA+"?text="+encodeURIComponent(t.hello);
  $("#waTop").href=u;$("#waFoot").href=u;$("#msg").textContent="";
}
$$(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

/* QR décoratifs (non scannables) */
function qrSvg(seed){const n=21;let s=seed;const r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;let d="";
for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  const f=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);let on;
  if(f){const fx=x<7?x:x-(n-7),fy=y<7?y:y-(n-7);on=fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4)}
  else on=r()>.52;
  if(on)d+=`M${x} ${y}h1v1h-1z`}
return `<svg class="q" viewBox="-1 -1 23 23"><path d="${d}"/></svg>`}
$("#qr").innerHTML=qrSvg(7);$("#qr2").innerHTML=qrSvg(21);

/* apparition au défilement */
const rv=$$(".rv");
/* The reveal effect is optional: content stays visible regardless of observer support. */
rv.forEach(e=>e.classList.add("in"));
if("IntersectionObserver" in window){
  try{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
    rv.forEach(e=>io.observe(e));
  }catch(err){ /* Keep content visible if an observer cannot start. */ }
}
